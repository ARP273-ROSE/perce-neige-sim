name: Viewer 3D et paquets

on:
  push:
    tags:
      - "v*"
  # Lancement à la main : « version » (sans le v) construit et publie depuis la
  # branche choisie ; « brouillon » garde la Release invisible pour la mise à
  # jour automatique des installations existantes tant qu'elle n'est pas
  # vérifiée (gh release edit vX.Y.Z --draft=false --latest).
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire et publier (sans le v), ex. 1.20.0"
        required: false
      brouillon:
        description: "Publier en BROUILLON"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6.1-stable"
  GODOT_BIN_TAG: "4.6.1"

jobs:
  # --------------------------------------------------------------------- #
  # Job 0 : module C++ (gdextension/, classe NoyauRemontee) compilé pour
  # chaque système. Le jeu s'en passe s'il manque (boucle GDScript).
  # --------------------------------------------------------------------- #
  gdextension:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, arch: x86_64 }
          - { os: windows-latest, platform: windows, arch: x86_64 }
          - { os: macos-latest, platform: macos, arch: universal }
          - { os: ubuntu-latest, platform: web, arch: wasm32 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: godot-cpp
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: godot-4.5-stable
          path: gdextension/godot-cpp
      - name: Python et SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons==4.9.1
      # web : même Emscripten que les modèles de Godot 4.6.1 (4.0.20), sans fils
      - name: Emscripten
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.20
      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: gdextension/godot-cpp/bin
          key: godot-cpp-4.5-${{ matrix.platform }}-${{ matrix.arch }}-v1
      - name: Compiler (debug et release)
        shell: bash
        working-directory: gdextension
        run: |
          set -e
          for t in template_debug template_release; do
            if [ "${{ matrix.platform }}" = "web" ]; then
              scons platform=web threads=no target=$t -j4
            else
              scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=$t -j4
            fi
          done
          ls -l bin_local/
      - uses: actions/upload-artifact@v4
        with:
          name: gdext-${{ matrix.platform }}
          path: gdextension/bin_local/libperce_neige*
          retention-days: 7

  # --------------------------------------------------------------------- #
  # Job 1 : exporte le viewer Godot 3D (Linux + Windows binaires) sur
  # Linux runner. Cross-compile Windows depuis Linux via les templates.
  # Les binaires sont uploadés en artifact pour les jobs build-* qui suivent.
  # --------------------------------------------------------------------- #
  godot-export:
    needs: gdextension
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # module C++ : à côté de son .gdextension, embarqué par l'export
      - name: Module C++
        uses: actions/download-artifact@v4
        with:
          pattern: gdext-*
          path: godot_project/bin
          merge-multiple: true
        continue-on-error: true

      - name: Cache Godot binary + templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot binary + templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot
          cd ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"
          unzip -q "Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"
          mv "Godot_v${{ env.GODOT_VERSION }}_linux.x86_64" godot
          chmod +x godot
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_BIN_TAG }}.stable
          cd /tmp
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"
          unzip -q "Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"
          cp templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_BIN_TAG }}.stable/

      # Version inscrite dans le jeu exporté (titre, relevés MESURE) : sans
      # elle, le programme installé se présentait comme « dev ».
      - name: Inscrire la version
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          sed -i "s|^const VERSION_APP: String = .*|const VERSION_APP: String = \"$V\"|" godot_project/scripts/constants.gd
          grep -n "VERSION_APP" godot_project/scripts/constants.gd

      # Note : l'export Godot headless peut retourner un code non nul malgré
      # un export réussi (warnings) → on ne teste pas le code retour mais la
      # présence effective du binaire produit.
      - name: Export Linux x86_64 viewer
        run: |
          set -e
          mkdir -p bundled_godot
          ~/godot/godot --headless --path godot_project --export-release "Linux x86_64" || true
          ls -lh bundled_godot/
          test -f bundled_godot/perce_neige_3d.x86_64 || (echo "ERROR: export Linux échoué (binaire absent)"; exit 1)

      # Linux ARM64 (14/10/2026) : le paquet Linux ARM64 du kit a son viewer
      - name: Export Linux arm64 viewer
        run: |
          set -e
          ~/godot/godot --headless --path godot_project --export-release "Linux arm64" || true
          ls -lh bundled_godot/
          test -f bundled_godot/perce_neige_3d.arm64 || (echo "ERROR: export Linux arm64 échoué (binaire absent)"; exit 1)

      - name: Export Windows x86_64 viewer
        run: |
          set -e
          ~/godot/godot --headless --path godot_project --export-release "Windows x86_64" || true
          ls -lh bundled_godot/
          test -f bundled_godot/perce_neige_3d.exe || (echo "ERROR: export Windows échoué (binaire absent)"; exit 1)

      # macOS (2026-10-03) : binaire universel (Apple Silicon + Intel),
      # signature ad hoc intégrée à Godot — exportable depuis Linux. Laissé
      # en .zip : un artefact GitHub perd les droits d'exécution, le job
      # macOS le décompresse avec ditto.
      - name: Export macOS viewer
        run: |
          set -e
          ~/godot/godot --headless --path godot_project --export-release "macOS" || true
          ls -lh bundled_godot/
          test -f bundled_godot/perce_neige_3d_macos.zip || (echo "ERROR: export macOS échoué (zip absent)"; exit 1)

      - name: Upload viewer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-viewers
          path: bundled_godot/
          retention-days: 7

  # --------------------------------------------------------------------- #
  # Job 2 : paquets du kit commun (_kit_windows), sur les trois systèmes —
  # installeur Windows, .dmg macOS (Apple Silicon, Intel), .tar.gz Linux
  # (x86_64, ARM64), archives de mise à jour par système, passerelle des
  # anciens paquets Linux, SHA256SUMS — publiés dans UNE Release par
  # release.yml (gabarit du kit, identique d'une application à l'autre).
  # Il attend godot-export : chaque paquet reçoit le viewer 3D de son
  # système par l'artefact « godot-viewers » (kit.json « copies »).
  # Le tag déclenche aussi release.yml directement : il s'efface alors
  # (artefact_prealable) et seul cet appel construit.
  # --------------------------------------------------------------------- #
  paquets:
    needs: godot-export
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      ref: ${{ inputs.version && github.sha || github.ref }}
      brouillon: ${{ inputs.brouillon == true }}
    secrets: inherit
    permissions:
      contents: write
